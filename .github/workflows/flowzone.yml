name: Flowzone

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main, master]
  # allow external contributions to use secrets within trusted code
  pull_request_target:
    types: [opened, synchronize, closed]
    branches: [main, master]

jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master # flowzonify 0.4.0
    # prevent duplicate workflow executions for pull_request and pull_request_target
    if: |
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event_name == 'pull_request'
      ) || (
        github.event.pull_request.head.repo.full_name != github.repository &&
        github.event_name == 'pull_request_target'
      )
    secrets: inherit
    with:
      # Runs .github/actions/test once per value x os cell. That action's header comment says what
      # each scenario exercises; keep the roster there, next to the steps it describes. Linux only:
      # 7z is guaranteed on ubuntu runners but not on macOS (self-hosted Linux runners must have
      # 7z / p7zip-full installed).
      custom_test_matrix: >
        {
          "value": ["encrypted", "plain", "merge", "split", "base-dir", "missing", "symlink", "dangling", "globstar"],
          "os": ["ubuntu-latest", ["self-hosted", "Linux"]]
        }
